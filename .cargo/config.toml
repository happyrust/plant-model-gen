[build]
# 默认禁用 OCC 功能避免 glam 版本冲突
rustflags = []
# sccache 跨项目编译缓存：本仓库所有 rustc 调用经由 sccache。
# 适用场景：频繁切换分支、clean build、surrealdb-core 等大依赖反复重编。
# 命中率查看：sccache --show-stats
# CI 不受影响：各 workflow 已显式设 RUSTC_WRAPPER=""（环境变量优先于本配置，
# 空串=禁用 wrapper，见 .github/workflows/*.yml）。
rustc-wrapper = "sccache"
# 关闭增量编译（覆盖所有 profile）：sccache 与 incremental 互斥，
# 增量产物 sccache 无法缓存；缓存复用统一交给 sccache。
incremental = false
# ─── 为何有时感觉“每次都重编”？───────────────────────────────────────────────
# 1. Feature 组合不同：每种 --features 对应独立产物。跑 room_demo 用 gen_model+sqlite-index，
#    若平时只 build 默认 features，首次跑该 example 会触发该组合的完整构建。
# 2. 首次跑某个 example：example 与 main/bin 的依赖可能不同，首次需完整构建该 example。
# 3. 建议：固定用同一套 features 跑回归，如总是 `--features "gen_model,sqlite-index"`，
#    第二次起即可命中 sccache 缓存。
# 4. [patch] aios_core = { path = "../rs-core" }：rs-core 任一文件改动会触发 aios-database 重编。

[env]
# sccache 与增量编译互斥：全仓库强制关闭增量（force=true 覆盖 shell/脚本里的残留
# CARGO_INCREMENTAL 设置），缓存复用统一交给 sccache。
CARGO_INCREMENTAL = { value = "0", force = true }

# 增大主线程栈大小，避免 debug 模式下 async 函数状态机导致的栈溢出
# 16MB 栈大小足以应对深度 async 调用链
[target.x86_64-pc-windows-msvc]
# 快赢 #1: 用工具链自带 rust-lld 替换慢速 link.exe（链接耗时 -50%~-80%）。
#   本 nightly(1.98) 无 -Zlinker-features，改用 -Clinker=rust-lld + lld-link flavor，
#   rustc 会自动从 sysroot 解析 rust-lld，无需写死路径（已实测可链接）。
# 快赢 #3: nightly 并行前端，缓解单体 crate 的类型检查耗时（-20%~-40%）。
# 注意：rustflags 变更会使构建指纹失效，首次为一次全量重建，之后增量才提速。
rustflags = [
    "-C", "link-args=/STACK:16777216",
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=lld-link",
    "-Zthreads=2",
]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:16777216"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--stack,16777216"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
# rustflags = ["-C", "link-args=-Wl,-stack_size,0x1000000"]




[profile.test]
# 单测/集成测试在 Windows + cranelift 下更易触发内存/链接异常；
# 统一改用 llvm，换稳定与可诊断性。
# codegen-backend = "llvm"

[profile.test.package."*"]
# codegen-backend = "llvm"

# ─── release：加速编译，保留足够运行时性能 ───────────────────────────────────
# 默认 release: opt-level=3, codegen-units=1, incremental=false
# 以下配置在"编译速度"与"运行性能"之间取折中：
[profile.release]
opt-level = 2              # 比 3 少几个重量级 pass（如 vectorization aggressive），编译快 20-40%
codegen-units = 4          # 降并行以降低 release 编译峰值内存（aios-database 大 crate）
incremental = false        # 关闭增量（与 sccache 互斥），缓存复用交给 sccache
split-debuginfo = "unpacked"  # macOS 链接加速，同 dev 配置

[profile.release.package."*"]
opt-level = 2              # 依赖项同步降级，否则自身 opt=2 但依赖仍跑 opt=3 pass
