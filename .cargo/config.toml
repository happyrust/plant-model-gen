[build]
# 默认禁用 OCC 功能避免 glam 版本冲突
rustflags = []
# ─── 为何有时感觉“每次都重编”？───────────────────────────────────────────────
# 1. Feature 组合不同：每种 --features 对应独立产物。跑 room_demo 用 gen_model+sqlite-index，
#    若平时只 build 默认 features，首次跑该 example 会触发该组合的完整构建。
# 2. 首次跑某个 example：example 与 main/bin 的依赖可能不同，首次需完整构建该 example。
# 3. 建议：固定用同一套 features 跑回归，如总是 `--features "gen_model,sqlite-index"`，
#    第二次起即为增量。
# 4. [patch] aios_core = { path = "../rs-core" }：rs-core 任一文件改动会触发 aios-database 重编。
# 5. sccache 跨项目编译缓存（可选）
# 适用场景：频繁切换分支、clean build、surrealdb-core 等大依赖反复重编
# 安装：brew install sccache
# 注意：sccache 与 incremental 互斥，必须设置环境变量：
#   export CARGO_INCREMENTAL=0
#
# CI 侧不保证安装 sccache，因此 **不要**在仓库级 `.cargo/config.toml` 里强制启用。
# 如需启用请在本机通过环境变量设置：
#   export RUSTC_WRAPPER=sccache

[env]
# 固定本仓库的本地迭代编译环境，避免不同 shell 中 CARGO_INCREMENTAL
# 状态不同导致大依赖反复重建。
CARGO_INCREMENTAL = { value = "1", force = true }

# 增大主线程栈大小，避免 debug 模式下 async 函数状态机导致的栈溢出
# 16MB 栈大小足以应对深度 async 调用链
[target.x86_64-pc-windows-msvc]
# 快赢 #1: 用工具链自带 rust-lld 替换慢速 link.exe（链接耗时 -50%~-80%）。
#   本 nightly(1.98) 无 -Zlinker-features，改用 -Clinker=rust-lld + lld-link flavor，
#   rustc 会自动从 sysroot 解析 rust-lld，无需写死路径（已实测可链接）。
# 快赢 #3: nightly 并行前端，缓解单体 crate 的类型检查耗时（-20%~-40%）。
# 注意：rustflags 变更会使构建指纹失效，首次为一次全量重建，之后增量才提速。
rustflags = [
    "-C", "link-args=/STACK:16777216",
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=lld-link",
    "-Zthreads=8",
]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:16777216"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--stack,16777216"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
# rustflags = ["-C", "link-args=-Wl,-stack_size,0x1000000"]


# 启用 per-profile codegen-backend（nightly 不稳定特性）
[unstable]
codegen-backend = true

[profile.dev]
# 根 crate(aios-database) 用 cranelift：debug 迭代编译显著加快（codegen -20%~-30%）
# 依赖仍走 LLVM（见下方 package."*"），避免个别 crate 在 cranelift 下不兼容。
codegen-backend = "cranelift"
debug = 1              # 仅行号表，加快编译和链接
incremental = true     # 显式开启增量编译（dev 默认已开，防止被环境变量覆盖）
split-debuginfo = "unpacked"  # macOS 关键优化：调试信息不打包，大幅缩短链接时间
                               # Linux 下此选项为默认行为，无负面影响
                               # 注：Windows MSVC 上此项为 no-op（调试信息走 PDB）

# 快赢 #6: 让 build script 与 proc-macro（serde/rkyv/strum derive、cc）在 opt-level=3
# 下运行，加快每次构建的宏展开/脚本执行。只影响编译期工具代码，不影响产物运行性能。
[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
# 所有依赖固定用 LLVM：依赖只编译一次（已缓存），且避免 cranelift 对个别
# 含 inline asm / 特殊 intrinsic 的 crate 不兼容。仅根 crate 走 cranelift。
codegen-backend = "llvm"
#opt-level = 1  # 依赖项轻度优化，减小产物体积加速链接

[profile.test]
# 单测/集成测试在 Windows + cranelift 下更易触发内存/链接异常；
# 统一改用 llvm，换稳定与可诊断性。
# codegen-backend = "llvm"

[profile.test.package."*"]
# codegen-backend = "llvm"

# ─── release：加速编译，保留足够运行时性能 ───────────────────────────────────
# 默认 release: opt-level=3, codegen-units=1, incremental=false
# 以下配置在"编译速度"与"运行性能"之间取折中：
[profile.release]
opt-level = 2              # 比 3 少几个重量级 pass（如 vectorization aggressive），编译快 20-40%
codegen-units = 16         # 并行代码生成，充分利用多核；代价：跨 codegen-unit 内联机会减少
incremental = true         # 开启增量，迭代改动无需全量重编
split-debuginfo = "unpacked"  # macOS 链接加速，同 dev 配置

[profile.release.package."*"]
opt-level = 2              # 依赖项同步降级，否则自身 opt=2 但依赖仍跑 opt=3 pass
