name: Deploy Web Server To Ubuntu

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      git_ref:
        description: '要部署的 git ref（分支、tag 或 commit）'
        required: true
        default: 'main'
        type: string
      db_option_file:
        description: 'Ubuntu 部署使用的 DbOption 文件（将上传为远端 /root/DbOption.toml）'
        required: true
        default: 'db_options/DbOption-mac.toml'
        type: string
      remote_host:
        description: '覆盖目标服务器地址；留空则取仓库变量 DEPLOY_REMOTE_HOST'
        required: false
        default: ''
        type: string
      remote_user:
        description: '覆盖 SSH 用户；留空则取仓库变量 DEPLOY_REMOTE_USER 或 root'
        required: false
        default: ''
        type: string
      deploy_surrealdb:
        description: '同时构建并部署匹配的 SurrealDB Linux 二进制'
        required: false
        default: false
        type: boolean
      surreal_ref:
        description: 'happyrust/surrealdb git ref（deploy_surrealdb=true 时使用）'
        required: false
        default: 'f01470af2660db59a94def365a9367d5b6bfd2e0'
        type: string
      ssh_public_key:
        description: '可选：写入远端 authorized_keys，用于本机同步数据库'
        required: false
        default: ''
        type: string
      ssh_key_only:
        description: '只安装 ssh_public_key，不构建/部署后端'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-web-server-ubuntu-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  BUILD_FEATURES: ws,gen_model,manifold,project_hd,surreal-save,sqlite-index,web_server,parquet-export

jobs:
  build-linux-artifact:
    name: Build Linux Release Artifact
    runs-on: ubuntu-latest
    if: ${{ !inputs.ssh_key_only }}

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Configure git for private repos
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
        shell: bash

      - name: Prepare local patch dependencies
        run: ./shells/prepare_ci_patch_deps.sh
        shell: bash

      - name: Setup git credentials
        run: |
          echo '#!/bin/bash' > /tmp/git-askpass.sh
          echo 'echo "${{ secrets.GH_PAT }}"' >> /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh
        shell: bash

      - name: Configure Cargo to use git CLI
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml
        shell: bash

      - name: Install Rust nightly (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy-web-server-ubuntu-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Build deploy-ready web_server
        run: |
          cargo build --release --bin web_server --target x86_64-unknown-linux-gnu --no-default-features --features "$BUILD_FEATURES"
        shell: bash
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Prepare artifact payload
        run: |
          mkdir -p ci-artifacts
          cp target/x86_64-unknown-linux-gnu/release/web_server ci-artifacts/web_server
          chmod +x ci-artifacts/web_server
          {
            echo "git_ref=${{ inputs.git_ref || github.ref_name }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "db_option_file=${{ inputs.db_option_file || 'db_options/DbOption-mac.toml' }}"
            echo "trigger=${{ github.event_name }}"
          } > ci-artifacts/BUILD_INFO.txt

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: ci-artifacts/
          retention-days: 14

  deploy-ubuntu:
    name: Deploy To Ubuntu
    runs-on: ubuntu-latest
    needs: build-linux-artifact
    if: ${{ !inputs.ssh_key_only }}
    environment: production

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release
          path: ci-artifacts

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Install temporary SSH public key
        if: ${{ inputs.ssh_public_key != '' }}
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_HOST" || { echo "Missing remote host"; exit 1; }
          test -n "$REMOTE_USER" || { echo "Missing remote user"; exit 1; }
          test -n "$REMOTE_PASS" || { echo "Missing secret DEPLOY_REMOTE_PASS."; exit 1; }
          test -n "$SSH_PUBLIC_KEY" || { echo "Missing ssh_public_key"; exit 1; }
          sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && grep -qxF '$SSH_PUBLIC_KEY' ~/.ssh/authorized_keys || echo '$SSH_PUBLIC_KEY' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"

      - name: Checkout SurrealDB
        if: ${{ inputs.deploy_surrealdb }}
        uses: actions/checkout@v4
        with:
          repository: happyrust/surrealdb
          ref: ${{ inputs.surreal_ref }}
          token: ${{ secrets.GH_PAT }}
          path: surrealdb

      - name: Install SurrealDB build toolchain
        if: ${{ inputs.deploy_surrealdb }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15

      - name: Rust cache for SurrealDB
        if: ${{ inputs.deploy_surrealdb }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: surrealdb
          shared-key: deploy-surrealdb-ubuntu
          cache-on-failure: true

      - name: Build SurrealDB binary
        if: ${{ inputs.deploy_surrealdb }}
        working-directory: surrealdb
        run: |
          sudo apt-get install -y build-essential clang cmake libclang-dev pkg-config protobuf-compiler
          rm -f ../.cargo/config.toml
          cargo build --release --bin surreal --locked --no-default-features --features storage-rocksdb,http,cli

      - name: Deploy SurrealDB binary
        if: ${{ inputs.deploy_surrealdb }}
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_HOST" || { echo "Missing remote host"; exit 1; }
          test -n "$REMOTE_USER" || { echo "Missing remote user"; exit 1; }
          test -n "$REMOTE_PASS" || { echo "Missing secret DEPLOY_REMOTE_PASS."; exit 1; }

          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          sshpass -p "$REMOTE_PASS" scp "${ssh_opts[@]}" surrealdb/target/release/surreal "$REMOTE_USER@$REMOTE_HOST:/tmp/surreal.new"
          sshpass -p "$REMOTE_PASS" ssh "${ssh_opts[@]}" "$REMOTE_USER@$REMOTE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          active_service=""
          if systemctl is-active --quiet surrealdb; then active_service="surrealdb"; fi
          if systemctl is-active --quiet surreal-8020; then active_service="surreal-8020"; fi

          systemctl stop web-server 2>/dev/null || true
          systemctl stop surrealdb 2>/dev/null || true
          systemctl stop surreal-8020 2>/dev/null || true

          if [ -x /usr/local/bin/surreal ]; then
            cp /usr/local/bin/surreal "/usr/local/bin/surreal.backup.$(date -u +%Y%m%d%H%M%S)"
          fi
          install -m 0755 /tmp/surreal.new /usr/local/bin/surreal
          /usr/local/bin/surreal version

          if [ -n "$active_service" ]; then
            systemctl start "$active_service"
          elif systemctl list-unit-files surreal-8020.service >/dev/null 2>&1; then
            systemctl start surreal-8020
          else
            systemctl start surrealdb
          fi

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8020/version && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8020/version | grep '3.2.0-nightly'
          REMOTE

      - name: Validate deploy inputs
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
          DB_OPTION_FILE: ${{ inputs.db_option_file || 'db_options/DbOption-mac.toml' }}
        run: |
          test -n "$REMOTE_HOST" || { echo "Missing remote host. Set workflow input remote_host or repo variable DEPLOY_REMOTE_HOST."; exit 1; }
          test -n "$REMOTE_USER" || { echo "Missing remote user. Set workflow input remote_user or repo variable DEPLOY_REMOTE_USER."; exit 1; }
          test -n "$REMOTE_PASS" || { echo "Missing secret DEPLOY_REMOTE_PASS."; exit 1; }
          test -f "$DB_OPTION_FILE" || { echo "DbOption file not found: $DB_OPTION_FILE"; exit 1; }
          test -f "ci-artifacts/web_server" || { echo "Artifact ci-artifacts/web_server not found"; exit 1; }

      - name: Deploy web_server bundle
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
          DB_OPTION_FILE: ${{ inputs.db_option_file || 'db_options/DbOption-mac.toml' }}
          BINARY_SOURCE: local
          BUILD_BINARY: 'false'
          LOCAL_BIN_OVERRIDE: ${{ github.workspace }}/ci-artifacts/web_server
        run: |
          chmod +x ./shells/deploy/deploy_web_server_bundle.sh
          ./shells/deploy/deploy_web_server_bundle.sh

      - name: Verify remote health via SSH
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
        run: |
          sshpass -p "$REMOTE_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$REMOTE_USER@$REMOTE_HOST" \
            "ok=1; \
             systemctl is-active web-server || ok=0; \
             curl -fsS http://127.0.0.1:3100/api/health >/dev/null || ok=0; \
             curl -fsS http://127.0.0.1:3100/api/projects >/dev/null || ok=0; \
             if [ \"\$ok\" != 1 ]; then \
               systemctl status web-server --no-pager -l || true; \
               journalctl -u web-server -n 120 --no-pager || true; \
               ss -tlnp | grep -E ':3100|:8020' || true; \
               exit 1; \
             fi"

  install-ssh-key:
    name: Install SSH Key Only
    runs-on: ubuntu-latest
    if: ${{ inputs.ssh_key_only && inputs.ssh_public_key != '' }}
    environment: production

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Install temporary SSH public key
        env:
          REMOTE_HOST: ${{ inputs.remote_host != '' && inputs.remote_host || vars.DEPLOY_REMOTE_HOST }}
          REMOTE_USER: ${{ inputs.remote_user != '' && inputs.remote_user || vars.DEPLOY_REMOTE_USER || 'root' }}
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_HOST" || { echo "Missing remote host"; exit 1; }
          test -n "$REMOTE_USER" || { echo "Missing remote user"; exit 1; }
          test -n "$REMOTE_PASS" || { echo "Missing secret DEPLOY_REMOTE_PASS."; exit 1; }
          sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && grep -qxF '$SSH_PUBLIC_KEY' ~/.ssh/authorized_keys || echo '$SSH_PUBLIC_KEY' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"
