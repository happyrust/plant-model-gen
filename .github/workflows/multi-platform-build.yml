name: Multi-Platform Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platform:
        description: '要编译的平台（all=全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64
          - centos-7.9-x64
          - macos-x64
          - macos-arm64
          - windows-x64

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ""
  STANDARD_FEATURES: ws,sqlite-index,surreal-save,web_server
  DEPLOY_FEATURES: ws,gen_model,manifold,project_hd,surreal-save,write-to-surrealdb,sqlite-index,web_server,parquet-export

jobs:
  select-platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          selected="${{ github.event_name == 'push' && 'all' || inputs.platform }}"
          case "$selected" in
            all)
              if [ "${{ github.event_name }}" = "push" ]; then
                matrix='{"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"linux-x64","target_system":"ubuntu-22.04","deploy_ready":"true"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"centos-7.9-x64","target_system":"centos-7.9","deploy_ready":"true","legacy_linux":"true"}]}'
              else
                matrix='{"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"linux-x64","target_system":"ubuntu-22.04","deploy_ready":"true"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"centos-7.9-x64","target_system":"centos-7.9","deploy_ready":"true","legacy_linux":"true"},{"os":"macos-latest","target":"x86_64-apple-darwin","artifact_name":"macos-x64","target_system":"macos-x64","deploy_ready":"false"},{"os":"macos-latest","target":"aarch64-apple-darwin","artifact_name":"macos-arm64","target_system":"macos-arm64","deploy_ready":"false"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"windows-x64","target_system":"windows-x64","deploy_ready":"false"}]}'
              fi
              ;;
            linux-x64)
              matrix='{"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"linux-x64","target_system":"ubuntu-22.04","deploy_ready":"true"}]}'
              ;;
            centos-7.9-x64)
              matrix='{"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"centos-7.9-x64","target_system":"centos-7.9","deploy_ready":"true","legacy_linux":"true"}]}'
              ;;
            macos-x64)
              matrix='{"include":[{"os":"macos-latest","target":"x86_64-apple-darwin","artifact_name":"macos-x64","target_system":"macos-x64","deploy_ready":"false"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"os":"macos-latest","target":"aarch64-apple-darwin","artifact_name":"macos-arm64","target_system":"macos-arm64","deploy_ready":"false"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"windows-x64","target_system":"windows-x64","deploy_ready":"false"}]}'
              ;;
            *)
              echo "Unsupported platform: $selected" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build - ${{ matrix.os }}
    needs: select-platforms
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-platforms.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure git for private repos
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
        shell: bash

      - name: Prepare local patch dependencies
        run: ./shells/prepare_ci_patch_deps.sh
        shell: bash
      
      - name: Setup git credentials
        run: |
          echo '#!/bin/bash' > /tmp/git-askpass.sh
          echo 'echo "${{ secrets.GH_PAT }}"' >> /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh
        shell: bash
      
      - name: Configure Cargo to use git CLI
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml
        shell: bash
      
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "multi-platform-${{ matrix.artifact_name }}"
          cache-on-failure: true
      
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential
      
      - name: Setup Windows build environment
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      
      - name: Build binaries (standard)
        if: matrix.deploy_ready != 'true'
        run: |
          cargo build --release --bin web_server --bin aios-database --target ${{ matrix.target }} --no-default-features --features "$STANDARD_FEATURES"
        shell: bash
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Build binaries (Ubuntu deploy-ready)
        if: matrix.artifact_name == 'linux-x64'
        run: |
          cargo build --release --bin web_server --bin aios-database --target ${{ matrix.target }} --no-default-features --features "$DEPLOY_FEATURES"
        shell: bash
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build binaries (CentOS 7.9 deploy-ready)
        if: matrix.artifact_name == 'centos-7.9-x64'
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          workspace_name="$(basename "$GITHUB_WORKSPACE")"
          docker run --rm \
            -v "$workspace_parent:/ci-work" \
            -w "/ci-work/$workspace_name" \
            -e GH_TOKEN \
            -e GIT_TERMINAL_PROMPT=0 \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -e DEPLOY_FEATURES="$DEPLOY_FEATURES" \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              host_ids="$(stat -c "%u:%g" .)"
              git config --global --add safe.directory "$(pwd)"
              git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
              source "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-gnu
              yum install -y perl-core pkgconfig unzip
              # manifold-rs 的 build.rs 硬编码 env::set_var("CMAKE_GENERATOR", "Ninja")，
              # 会覆盖任何 CMAKE_GENERATOR 环境变量，因此容器内必须装 Ninja；manylinux2014
              # 未自带 ninja 且 python3 不在默认 PATH，改用预编译静态二进制最稳。
              curl --proto "=https" --tlsv1.2 -sSfL https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-linux.zip -o /tmp/ninja.zip
              unzip -o /tmp/ninja.zip -d /usr/local/bin
              chmod +x /usr/local/bin/ninja
              ninja --version
              # manylinux2014(CentOS7 baseline) 不带 lld，但仓库 .cargo/config.toml 对
              # x86_64-unknown-linux-gnu 强制 -fuse-ld=lld；该容器内改用默认 GNU ld，
              # 避免链接阶段报找不到 ld.lld。
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=""
              cargo build --release --bin web_server --bin aios-database --target x86_64-unknown-linux-gnu --no-default-features --features "$DEPLOY_FEATURES,ssh2-vendored-openssl"
              chown -R "$host_ids" target/x86_64-unknown-linux-gnu/release
            '
        shell: bash
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Build library
        if: matrix.deploy_ready != 'true'
        run: |
          cargo build --release --lib --target ${{ matrix.target }} --no-default-features --features "$STANDARD_FEATURES"
        shell: bash
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Package artifacts
        run: |
          mkdir -p release-package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/web_server.exe release-package/
            cp target/${{ matrix.target }}/release/aios-database.exe release-package/
            cp target/${{ matrix.target }}/release/aios_database.dll release-package/ 2>/dev/null || true
          else
            cp target/${{ matrix.target }}/release/web_server release-package/
            cp target/${{ matrix.target }}/release/aios-database release-package/
            cp target/${{ matrix.target }}/release/libaios_database.* release-package/ 2>/dev/null || true
          fi
          echo "Build Date: $(date '+%Y-%m-%d %H:%M:%S')" > release-package/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> release-package/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> release-package/BUILD_INFO.txt
          echo "Target: ${{ matrix.target }}" >> release-package/BUILD_INFO.txt
          echo "Artifact: ${{ matrix.artifact_name }}" >> release-package/BUILD_INFO.txt
          echo "Target System: ${{ matrix.target_system }}" >> release-package/BUILD_INFO.txt
          if [ "${{ matrix.deploy_ready }}" = "true" ]; then
            echo "Features: $DEPLOY_FEATURES" >> release-package/BUILD_INFO.txt
            echo "Deploy-Ready: true" >> release-package/BUILD_INFO.txt
            if [ "${{ matrix.artifact_name }}" = "centos-7.9-x64" ]; then
              echo "Linux ABI: manylinux2014 / CentOS 7 compatible glibc baseline" >> release-package/BUILD_INFO.txt
            fi
          else
            echo "Features: $STANDARD_FEATURES" >> release-package/BUILD_INFO.txt
            echo "Deploy-Ready: false" >> release-package/BUILD_INFO.txt
          fi
        shell: bash
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-release
          path: release-package/*
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release
          path: ./deploy-package
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Deploy to production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts
          
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE_DIR="/opt/plant-model-gen/releases/$VERSION"
          
          ssh -i ~/.ssh/deploy_key $PROD_USER@$PROD_HOST "mkdir -p $RELEASE_DIR"
          
          scp -i ~/.ssh/deploy_key deploy-package/web_server $PROD_USER@$PROD_HOST:$RELEASE_DIR/
          scp -i ~/.ssh/deploy_key deploy-package/BUILD_INFO.txt $PROD_USER@$PROD_HOST:$RELEASE_DIR/
          
          ssh -i ~/.ssh/deploy_key $PROD_USER@$PROD_HOST << 'ENDSSH'
            VERSION="${{ steps.version.outputs.VERSION }}"
            RELEASE_DIR="/opt/plant-model-gen/releases/$VERSION"
            CURRENT_LINK="/opt/plant-model-gen/current"
            ACTIVE_BIN="/root/web_server"
            
            chmod +x $RELEASE_DIR/web_server
            
            # Create symlink to output directory
            ln -sfn /root/output $RELEASE_DIR/output
            echo "Created symlink: $RELEASE_DIR/output -> /root/output"
            
            if [ -L "$CURRENT_LINK" ]; then
              PREV_RELEASE=$(readlink $CURRENT_LINK)
              echo "Previous release: $PREV_RELEASE"
            fi
            
            ln -sfn $RELEASE_DIR $CURRENT_LINK
            echo "Deployed version $VERSION to production"

            # 当前生产 systemd 仍通过 /root/web_server 启动，需同步覆盖活动二进制，
            # 避免仅切换 current 软链但实际服务仍跑旧版本。
            install -m 755 $RELEASE_DIR/web_server $ACTIVE_BIN
            echo "Updated active binary: $ACTIVE_BIN"
            
            sudo systemctl restart web-server
            sleep 5
            sudo systemctl is-active web-server
            curl -fsS http://127.0.0.1:3100/api/version
          ENDSSH
