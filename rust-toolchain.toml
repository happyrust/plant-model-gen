[toolchain]
# 与 ../rs-core 保持同一编译器（aios_core 走 path patch，两仓必须同工具链）。
# 钉住 1.98 nightly：2026-07 的 1.99 nightly (如 3d50c25bc 2026-07-16) 在 -Zthreads 并行前端下
# 编译 proc-macro 会 ICE；cranelift per-profile codegen-backend 也依赖 nightly 组件可用。
# 升级前请先用目标 nightly 对两仓全量 cargo check 验证后再同步修改两边的 pin。
channel = "nightly-2026-06-25"
components = ["rustc-codegen-cranelift", "clippy", "rustfmt"]
