<rect width="1400" height="980" fill="#ffffff"/>
<text x="700.0" y="36" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">
  <tspan x="700.0" dy="0">7997 Release 模型生成写入流水线架构与提速方案</tspan>
</text>
<text x="700.0" y="64" text-anchor="middle" fill="#6b7280" font-size="13" font-weight="400">
  <tspan x="700.0" dy="0">当前瓶颈：生产与 mesh 阶段很快，SurrealDB base 写入和 inst_relate_aabb DELETE+INSERT 慢，导致 join 队列背压。</tspan>
</text>
<rect x="40" y="95" width="1320" height="360" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="700" y="125" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">
  <tspan x="700" dy="0">当前架构：逐批写入，背压集中在写库侧</tspan>
</text>
<rect x="40" y="500" width="1320" height="340" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="700" y="530" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">
  <tspan x="700" dy="0">推荐架构：两阶段批量写入，先稳定再提速</tspan>
</text>
