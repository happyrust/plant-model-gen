</text>
<text x="165.0" y="188" text-anchor="middle" fill="#ea580c" font-size="14" font-weight="700">
  <tspan x="165.0" dy="0">配置与输入</tspan>
</text>
<text x="155.0" y="218" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">
  <tspan x="155.0" dy="0">DbOption-generate</tspan>
  <tspan x="155.0" dy="15">ams7997_0001</tspan>
</text>
</g>
<g id="prod">
