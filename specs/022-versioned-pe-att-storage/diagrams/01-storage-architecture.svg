<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
  </style>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Spec 022 · PE/ATT 版本化存储总体架构</text>
  <text x="480" y="45" text-anchor="middle" font-size="10" fill="#64748b">SurrealDB fork dev-3.1 · RocksDB MVCC（user-defined timestamps） · specs/022-versioned-pe-att-storage</text>
  <!-- legend -->
  <rect x="664" y="52" width="256" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="676" y="70" font-size="12" font-weight="bold" fill="#475569">图例</text>
  <line x1="676" y1="84" x2="712" y2="84" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="720" y="88" font-size="10" fill="#334155">数据落库写入（全量 / 增量）</text>
  <line x1="676" y1="101" x2="712" y2="101" stroke="#059669" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
  <text x="720" y="105" font-size="10" fill="#334155">锚点固化（成功才写）</text>
  <line x1="676" y1="118" x2="712" y2="118" stroke="#059669" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <text x="720" y="122" font-size="10" fill="#334155">历史查询（VERSION 读）</text>
  <line x1="676" y1="135" x2="712" y2="135" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <text x="720" y="139" font-size="10" fill="#334155">窗口外兤底：源 db 重扫</text>
  <line x1="676" y1="152" x2="712" y2="152" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="720" y="156" font-size="10" fill="#334155">GC 水位线（retention 回收）</text>
  <!-- layer containers (drawn first so labels can mask their borders) -->
  <rect x="40" y="52" width="600" height="90" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="52" y="70" font-size="12" font-weight="bold" fill="#64748b">数据源层</text>
  <rect x="40" y="190" width="880" height="256" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="52" y="208" font-size="12" font-weight="bold" fill="#64748b">主存储层</text>
  <rect x="600" y="214" width="304" height="216" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="612" y="232" font-size="11" font-weight="bold" fill="#64748b">共存与分工</text>
  <rect x="40" y="470" width="880" height="126" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="52" y="488" font-size="12" font-weight="bold" fill="#64748b">消费层</text>
  <!-- data source layer -->
  <rect x="210" y="72" width="270" height="54" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="345" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">PDMS 源 .db 文件</text>
  <text x="345" y="112" text-anchor="middle" font-size="10" fill="#b45309">长期保留 · retention 窗口外历史的最终兤底</text>
  <!-- ingest arrows -->
  <line x1="280" y1="126" x2="280" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="180" y="148" width="200" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="280" y="160" text-anchor="middle" font-size="10.5" fill="#1d4ed8">sync_pdms 全量重灌（重建/切换）</text>
  <line x1="410" y1="126" x2="410" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="332" y="184" width="156" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="410" y="196" text-anchor="middle" font-size="10.5" fill="#1d4ed8">incremental-sesno 增量解析</text>
  <!-- anchor write (success only) -->
  <circle cx="410" cy="172" r="3" fill="#059669"/>
  <path d="M410,172 H500 V264" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
  <rect x="500" y="174" width="192" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="504" y="186" font-size="10.5" fill="#047857">落库成功收尾固化锚点（失败不写）</text>
  <!-- main storage layer -->
  <rect x="60" y="214" width="520" height="216" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">SUL_DB 项目主库（SurrealDB fork · RocksDB MVCC）</text>
  <text x="320" y="254" text-anchor="middle" font-size="10.5" fill="#1d4ed8" class="mono">rocksdb://&lt;dir&gt;?versioned=true&amp;retention=90d</text>
  <!-- table cylinders -->
  <path d="M75.5,272 V326 A47.5,8 0 0 0 170.5,326 V272" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <ellipse cx="123" cy="272" rx="47.5" ry="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="123" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">PE 表</text>
  <path d="M194.5,272 V326 A47.5,8 0 0 0 289.5,326 V272" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <ellipse cx="242" cy="272" rx="47.5" ry="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="242" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">noun 表</text>
  <path d="M304.5,272 V326 A47.5,8 0 0 0 399.5,326 V272" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <ellipse cx="352" cy="272" rx="47.5" ry="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="352" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">ATT_UDA 表</text>
  <text x="140" y="358" font-size="10" fill="#475569">历史由 MVCC 透明保留 · 不新增字段 · 硬 DELETE 可回溯</text>
  <!-- anchor table -->
  <rect x="430" y="266" width="140" height="80" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="500" y="281" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#854d0e" class="mono">sesno_version_anchor</text>
  <text x="500" y="295" text-anchor="middle" font-size="9.5" fill="#a16207" class="mono">{ dbnum, sesno,</text>
  <text x="500" y="307" text-anchor="middle" font-size="9.5" fill="#a16207" class="mono">anchored_at, source }</text>
  <text x="500" y="320" text-anchor="middle" font-size="9.5" fill="#a16207" class="mono">source: full | incr</text>
  <text x="500" y="337" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">sesno ↔ 时间戳唯一桥梁</text>
  <!-- GC watermark -->
  <text x="488" y="384" text-anchor="end" font-size="9.5" font-weight="bold" fill="#c2410c">retention=90d → GC 水位线 full_history_ts_low</text>
  <line x1="76" y1="394" x2="564" y2="394" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="140" y="412" font-size="10" fill="#9a3412">GC 以 60s 粒度推进 · 回收窗口外历史兼顾磁盘（默认 retention=0 无限保留）</text>
  <!-- coexistence -->
  <rect x="614" y="244" width="276" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="752" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b7280">MODEL_KV 独立实例（原设计）</text>
  <text x="752" y="278" text-anchor="middle" font-size="9.5" fill="#6b7280">承接模型高频写 inst_relate / mesh 等</text>
  <text x="752" y="296" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#dc2626">※ 2026-07-16 更新：分离机制已整体移除</text>
  <text x="752" y="312" text-anchor="middle" font-size="9.5" fill="#dc2626">模型表与 PE/ATT 同库一并版本化（决策 1）</text>
  <rect x="614" y="340" width="276" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="752" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">DuckLake release 交付存档</text>
  <text x="752" y="374" text-anchor="middle" font-size="9.5" fill="#15803d">交付物不可变存档（粗粒度 · 长期保留）</text>
  <text x="752" y="390" text-anchor="middle" font-size="9.5" fill="#15803d">与 versioned 历史（细粒度 · retention 窗口）</text>
  <text x="752" y="406" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">正交分工 · 共存互补</text>
  <!-- consumer layer -->
  <rect x="70" y="500" width="340" height="62" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="240" y="523" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">CLI：model-version history</text>
  <text x="240" y="543" text-anchor="middle" font-size="10" fill="#6d28d9">snapshot / timeline / diff（均支持 --json）</text>
  <rect x="480" y="500" width="380" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">rs-core version_query 封装</text>
  <text x="670" y="535" text-anchor="middle" font-size="9.5" fill="#6d28d9">sesno→时间戳换算（resolve_anchor 最近不大于回退）</text>
  <text x="670" y="552" text-anchor="middle" font-size="9.5" fill="#6d28d9">VERSION 查询拼接 · GC 越界 InvalidArgument→HistoryExpired</text>
  <line x1="410" y1="531" x2="478" y2="531" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="70" y="586" font-size="9.5" fill="#6b7280">sesno 超出 retention 窗口 → HistoryExpired → 走左侧灰虚线回 PDMS 源文件重扫</text>
  <!-- history query arrows -->
  <path d="M520,500 V484 H123 V336" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <rect x="127" y="450" width="164" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="131" y="462" font-size="10" fill="#047857">② SELECT … VERSION $t</text>
  <path d="M540,500 V348" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <rect x="546" y="450" width="150" height="16" fill="#ffffff" opacity="0.95"/>
  <text x="550" y="462" font-size="10" fill="#047857">① 锚点换算 sesno→$t</text>
  <!-- expired fallback to source files -->
  <path d="M70,548 H30 V98 H208" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <text x="920" y="630" text-anchor="end" font-size="9" fill="#94a3b8">依据 spec.md / plan.md / tasks.md / ops-notes.md 绘制 · 2026-07-18</text>
</svg>
