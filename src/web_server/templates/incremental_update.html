<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>增量版本水位 - AIOS Database</title>
    <link rel="stylesheet" href="/static/simple-tailwind.css">
    <link rel="stylesheet" href="/static/simple-icons.css">
    <style>
        .source-full { background-color: #dbeafe; color: #1d4ed8; }
        .source-incremental { background-color: #dcfce7; color: #047857; }
        .pending-badge { background-color: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-layer-group text-2xl text-blue-600 mr-3"></i>
                    <h1 class="text-xl font-bold text-gray-900">增量版本水位（Version Anchor）</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-xs text-gray-500 hidden md:inline">
                        增量执行走 CLI：<code>incremental-sesno</code> / <code>watch-incremental</code>
                    </span>
                    <button id="refresh-all" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-refresh mr-2"></i>刷新状态
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 统计概览 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">数据库数</p>
                        <p class="text-2xl font-bold text-gray-900" id="total-dbs">0</p>
                    </div>
                    <i class="fas fa-database text-3xl text-blue-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">已锚定库</p>
                        <p class="text-2xl font-bold text-green-600" id="total-anchored">0</p>
                    </div>
                    <i class="fas fa-anchor text-3xl text-green-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Commit Pending</p>
                        <p class="text-2xl font-bold text-red-600" id="total-pending-commits">0</p>
                    </div>
                    <i class="fas fa-triangle-exclamation text-3xl text-red-500"></i>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">上次检查</p>
                        <p class="text-sm font-medium text-gray-900" id="last-check">--</p>
                    </div>
                    <i class="fas fa-history text-3xl text-gray-500"></i>
                </div>
            </div>
        </div>

        <!-- 数据库列表 -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">各库 Committed Watermark</h2>
                <span class="text-xs text-gray-500">事实源：sesno_version_anchor · dbnum_info_table · version_commit_state</span>
            </div>
            <div class="p-6">
                <div id="dbs-container" class="space-y-4">
                    <!-- 数据库卡片将通过 JavaScript 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框（锚点时间线） -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-1000">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white z-1010">
            <div class="flex justify-between items-center pb-3 border-b">
                <h3 class="text-xl font-bold text-gray-900" id="modal-title">锚点时间线</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="mt-4" id="modal-content">
                <!-- 详情内容将动态加载 -->
            </div>
        </div>
    </div>

    <script src="/static/incremental_update.js"></script>
</body>
</html>
